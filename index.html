function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function ymd(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function pd(s){var p=s.split('-');return new Date(+p[0],p[1]-1,+p[2]);}

function dist(a,b,c,d){var R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(h));}
function getPos(cb){if(!navigator.geolocation)return cb(null);var done=false,t=setTimeout(function(){if(!done){done=true;cb(null);}},9000);

function send(body,okMsg){body.k=KEY;body.qid=qid();body.ts=Date.now();body.d=body.d||D||ymd(new Date());
 if(getQ().length||navigator.onLine===false){queue(body);return;}

  if(q2.length)flush();else{netBar();load(D,1);}}).catch(function(){BUSY=false;netBar();});}
