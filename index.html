var GD={"pol":{"lead":"Δουλεύουμε από τον τελευταίο όροφο προς την είσοδο, ώστε η σκόνη να κατεβαίνει και να μη λερώνουμε ό,τι καθαρίσαμε.","bring":["Σκούπα ή σκούπα με φαράσι","Σφουγγαρίστρα & κουβάς με στίφτη","Πανάκια μικροΐνης (2 χρώματα)","Καθαριστικό τζαμιών & γενικό καθαριστικό Καθαρά Χέρια","Πινακίδα «Βρεγμένο δάπεδο»","Σακούλες απορριμμάτων"],"steps":["Ανεβαίνετε με το ασανσέρ ή τη σκάλα στον τελευταίο όροφο.","Σε κάθε όροφο, από πάνω προς τα κάτω: ξεσκόνισμα κουπαστής και καγκέλων, διακόπτες και κουδούνια.","Σκούπισμα του πλατύσκαλου και των σκαλιών μέχρι τον επόμενο όροφο, πρώτα στις γωνίες.","Όταν φτάσετε στην είσοδο, ξανανεβαίνετε και σφουγγαρίζετε από πάνω προς τα κάτω, με την πινακίδα στην είσοδο.","Είσοδος: γραμματοκιβώτια, δαχτυλιές στα τζάμια και στην πόρτα, χαλάκι, πάτωμα.","Ασανσέρ (αν υπάρχει): καθρέφτης, ταμπλό και κουμπιά, πάτωμα καμπίνας, πόρτες.","Φωτογραφία τέλους από την είσοδο προς τη σκάλα."],"items":["Ξεσκόνισμα κουπαστών & καγκέλων","Διακόπτες & κουδούνια","Σκούπισμα σκάλας & πλατύσκαλων","Σφουγγάρισμα σκάλας & πλατύσκαλων","Είσοδος: πάτωμα & χαλάκι","Τζάμια & πόρτα εισόδου – δαχτυλιές","Γραμματοκιβώτια","Ασανσέρ: καθρέφτης, ταμπλό, πάτωμα (αν υπάρχει)"],"extra":[{"when":"2/εβδ","item":"Τζάμια εισόδου – πλήρες καθάρισμα (1 φορά την εβδομάδα)"},{"when":"9–16","item":"Πιλοτή / ράμπα – πλύσιμο (1 φορά τον μήνα, αν συμφωνήθηκε)"}],"check":["Δεν έμειναν νερά ή γλιστερά σκαλιά","Χαλάκι στη θέση του, πόρτα εισόδου κλειστή","Τίποτα δικό μας ξεχασμένο σε όροφο"]},"graf":{"lead":"Ο χώρος πρέπει να είναι έτοιμος για κοινό: πρώτα ό,τι πιάνουν τα χέρια, τελευταία το πάτωμα.","bring":["Πανάκια μικροΐνης (χρώμα για WC, χρώμα για επιφάνειες)","Σφουγγαρίστρα & κουβάς","Γενικό καθαριστικό, καθαριστικό τζαμιών, καθαριστικό WC Καθαρά Χέρια","Σακούλες απορριμμάτων"],"steps":["Άδειασμα όλων των κάδων και νέες σακούλες. Ανακυκλώσιμα χωριστά.","Ξεσκόνισμα γραφείων, ραφιών, πάγκων. Τα χαρτιά και οι οθόνες δεν μετακινούνται.","Πόμολα, διακόπτες, χερούλια, τηλέφωνα πάγκου.","Κουζινάκι: πάγκος, νεροχύτης, βρύση, εξωτερικά ψυγείου και καφετιέρας.","Τουαλέτα τελευταία από τις επιφάνειες: νιπτήρας, καθρέφτης, λεκάνη μέσα-έξω, αναλώσιμα (χαρτί, σαπούνι).","Δάπεδα: σκούπισμα και σφουγγάρισμα, από το βάθος προς την πόρτα.","Φωτογραφία τέλους από την είσοδο."],"items":["Άδειασμα κάδων & νέες σακούλες","Ξεσκόνισμα επιφανειών & γραφείων","Πόμολα, διακόπτες, χερούλια","Κουζινάκι: πάγκος & νεροχύτης","Τουαλέτα: λεκάνη, νιπτήρας, καθρέφτης, αναλώσιμα","Δάπεδα: σκούπισμα & σφουγγάρισμα"],"extra":[{"when":"2/εβδ","item":"Τζάμια βιτρίνας – εσωτερικά"}],"check":["Αναλώσιμα τουαλέτας γεμάτα – αν τελειώνουν, σημείωση","Φώτα και κλιματιστικό όπως τα βρήκατε","Συναγερμός / κλείδωμα όπως λένε οι οδηγίες"]},"gen":{"lead":"Δωμάτιο-δωμάτιο, από πάνω προς τα κάτω, με την κουζίνα πριν από το μπάνιο.","bring":["Ηλεκτρική σκούπα (αν δεν έχει ο πελάτης)","Πανάκια μικροΐνης σε 2 χρώματα","Σφουγγαρίστρα & κουβάς","Γενικό καθαριστικό, καθαριστικό τζαμιών, καθαριστικό μπάνιου Καθαρά Χέρια"],"steps":["Σύντομη βόλτα με τον πελάτη: τι θέλει οπωσδήποτε και τι δεν αγγίζουμε.","Ξεσκόνισμα σε όλα τα δωμάτια, από ψηλά (ράφια, κάδρα) προς τα κάτω (κομοδίνα, πόδια επίπλων).","Κουζίνα: πάγκοι, εστίες, νεροχύτης, πρόσοψη ντουλαπιών, εξωτερικά συσκευών.","Μπάνιο: νιπτήρας, καθρέφτης, ντουζιέρα ή μπανιέρα, πλακάκια γύρω, λεκάνη τελευταία.","Πόμολα και διακόπτες σε όλο το σπίτι.","Τζάμια μόνο αν συμφωνήθηκε στην κράτηση.","Δάπεδα: σκούπισμα και σφουγγάρισμα, από το πιο απομακρυσμένο δωμάτιο προς την έξοδο.","Άδειασμα κάδων και φωτογραφία τέλους."],"items":["Ξεσκόνισμα (πάνω → κάτω)","Κουζίνα: πάγκοι, εστίες, νεροχύτης, ντουλάπια","Μπάνιο: νιπτήρας, ντους/μπανιέρα, πλακάκια, λεκάνη","Πόμολα & διακόπτες","Δάπεδα: σκούπισμα & σφουγγάρισμα","Τζάμια (αν συμφωνήθηκε)","Άδειασμα κάδων"],"extra":[],"check":["Ο πελάτης (αν είναι εκεί) βλέπει κουζίνα και μπάνιο πριν φύγετε","Τίποτα δικό του μετακινημένο χωρίς λόγο","Παράθυρα κλειστά, φώτα σβηστά"]},"ana":{"lead":"Η σκόνη της οικοδομής ξανακάθεται: πρώτα τη μαζεύουμε στεγνά, μετά πλένουμε, και τα δάπεδα θέλουν δύο περάσματα.","bring":["Ηλεκτρική σκούπα με καλό φίλτρο","Ξύστρα τζαμιών (μόνο για τζάμια)","Πολλά πανάκια μικροΐνης","Σφουγγαρίστρα, 2 κουβάδες","Γενικό καθαριστικό, καθαριστικό τζαμιών Καθαρά Χέρια","Μάσκα σκόνης"],"steps":["Στεγνή απομάκρυνση σκόνης με ηλεκτρική σκούπα: ταβάνια και γωνίες, κουφώματα, ράγες, πρεβάζια, ντουλάπια μέσα-έξω.","Τζάμια και κουφώματα: υπολείμματα μπογιάς ή σιλικόνης με την ξύστρα, μόνο σε τζάμι και πάντα βρεγμένο.","Πλακάκια και αρμοί σε κουζίνα και μπάνιο.","Κουζίνα και μπάνιο όπως στον γενικό καθαρισμό.","Δάπεδα: πρώτο πέρασμα για τη λευκή σκόνη, άλλαγμα νερού, δεύτερο πέρασμα.","Φωτογραφία τέλους στο κάθε δωμάτιο."],"items":["Σκόνη: ηλεκτρική σκούπα σε γωνίες, κουφώματα, ράγες","Τζάμια & κουφώματα (υπολείμματα με ξύστρα)","Πλακάκια & αρμοί","Κουζίνα & μπάνιο","Δάπεδα: 2 περάσματα"],"extra":[],"check":["Δεν μένει λευκό «πέπλο» στο πάτωμα όταν το κοιτάτε κόντρα στο φως","Τζάμια χωρίς γρατζουνιές από την ξύστρα","Μπάζα ή υλικά του συνεργείου: δεν τα πετάμε, σημείωση στον πελάτη"]},"ora":{"lead":"Ο πελάτης ορίζει τι γίνεται. Εμείς βάζουμε προτεραιότητες ώστε να χωρέσουν στις ώρες που πλήρωσε.","bring":["Ό,τι χρειάζεται για τις εργασίες που ζήτησε – δείτε τις οδηγίες της δουλειάς","Βασικό σετ: πανάκια, σφουγγαρίστρα, γενικό καθαριστικό Καθαρά Χέρια"],"steps":["Στην αρχή επιβεβαιώνετε με τον πελάτη τι θέλει και με ποια σειρά.","Αν δεν χωράνε όλα στις ώρες, του το λέτε από την αρχή και ρωτάτε τι προηγείται.","Δουλεύετε με τους γενικούς κανόνες: πάνω → κάτω, καθαρό → βρώμικο, πάτωμα τελευταίο.","10 λεπτά πριν τη λήξη ενημερώνετε τον πελάτη τι έγινε και τι έμεινε.","Φωτογραφία τέλους."],"items":["Οδηγίες πελάτη – επιβεβαίωση στην αρχή","Εργασίες που ζητήθηκαν","Ενημέρωση πελάτη στο τέλος"],"extra":[],"check":["Ό,τι δεν πρόλαβε να γίνει γράφεται στη σημείωση","Δεν ξεπερνάμε τις ώρες χωρίς έγκριση του πελάτη"]}};

function guide(k){var g=GD[k],li=function(a){return a.map(function(t){return '<li>'+esc(t)+'</li>';}).join('');};return '<details class="gd"><summary>📖 Οδηγός εργασίας</summary><p>'+esc(g.lead)+'</p><h4>🧰 Τι παίρνεις μαζί</h4><ul>'+li(g.bring)+'</ul><h4>👣 Βήματα</h4><ol>'+li(g.steps)+'</ol><h4>🔎 Πριν φύγεις</h4><ul>'+li(g.check)+'</ul><p class="wr">⚠️ Ποτέ χλώριο μαζί με άλλο καθαριστικό, ξύδι ή αμμωνία. Γάντια πάντα· πινακίδα «Βρεγμένο δάπεδο» όπου περνά κόσμος.</p></details>';}

 document.getElementById('pb').style.width=(J.length?100*done/J.length:0)+'%';
 var h='';if(!J.length){h='<div class="empty">🌿 Καμία εργασία για αυτή τη μέρα.<br>Καλή ξεκούραση!</div>';}
 else{var end=J[J.length-1];h+='<div class="sum"><div><b>'+J.length+'</b>εργασίες</div><div><b>'+tot+' ώρ.</b>σύνολο</div><div><b>'+done+'/'+J.length+'</b>έτοιμες</div><div><b>'+hm(mins(end.start)+end.dur*60)+'</b>τέλος</div></div>';
  if(isToday){var nx=J.filter(function(j){return !/✅/.test(j.status);})[0];if(nx){var dm=mins(nx.start)-mins(r.now);h+='<div class="next">🧭 Επόμενο: '+esc(nx.name)+' · '+nx.start+(dm>0?' (σε '+(dm>=60?Math.floor(dm/60)+' ώρ. ':'')+(dm%60)+' λεπτά)':' – ώρα να ξεκινήσεις')+'</div>';}else h+='<div class="next" style="background:#e8f5e9;border-color:#a5d6a7">🎉 Όλες οι εργασίες ολοκληρώθηκαν!</div>';}
  J.forEach(function(j){var k=kind(j.svc),ck=getCk(j.id),run=/εξέλιξη/.test(j.status),ok=/✅/.test(j.status),q=encodeURIComponent(j.addr+' Φλώρινα');
   h+='<div class="card'+(run?' run':'')+(ok?' ok':'')+'"><span class="st">'+esc(j.status)+'</span><div class="tm">'+j.start+'–'+hm(mins(j.start)+j.dur*60)+' <small>('+j.dur+' ώρ.)</small></div><div class="nm">'+esc(j.name)+'</div><div class="ad">📍 '+esc(j.addr||'—')+'</div><span class="svc">'+esc(j.svc)+'</span>'+(j.notes?'<div class="nt">🔑 '+esc(j.notes)+'</div>':'');
   h+='<div class="row"><a class="b" href="https://www.google.com/maps/dir/?api=1&destination='+q+'" target="_blank">🧭 Πλοήγηση</a>'+(j.tel?'<a class="b" href="tel:'+esc(j.tel.replace(/\s/g,''))+'">📞 Κλήση</a>':'')+'<label class="b">📷 Φωτογραφία<input type="file" accept="image/*" capture="environment" style="display:none" onchange="photo(\''+j.id+'\',this)"></label></div>';
   if(run){var el=mins(r.now)-mins(j.t0);h+='<div class="timer" data-t0="'+j.t0+'" data-dur="'+j.dur+'"></div>';}
   h+=guide(k)+'<ul class="ck">'+(CKJ[j.id]=ckList(j)).map(function(t){return '<li><input type="checkbox" '+(ck[t]?'checked':'')+' onchange="tick(\''+j.id+'\',this,\''+t.replace(/'/g,"\\'")+'\')"><span>'+esc(t)+'</span></li>';}).join('')+'</ul>';
   if(!run&&!ok)h+='<div class="row"><button class="b go" onclick="act(\''+j.id+'\',\'start\')">▶️ Ξεκινάω</button></div>';
   if(run)h+='<div class="row"><button class="b done" onclick="finish(\''+j.id+'\',\''+k+'\')">✅ Τελείωσα</button></div>';
   if(ok)h+='<div class="sub" style="margin-top:.5rem;color:var(--mu)">⏱ '+(j.hasT0?j.t0:'')+(j.hasT1?' → '+j.t1:'')+(j.photos?' · 📷 φωτογραφίες ✓':'')+'</div>';
   if(BOSS)h+='<div class="row"><label class="b rc">🧾 '+(j.receipt?'Παραστατικό ✓ (αλλαγή)':'Ανέβασμα παραστατικού')+'<input type="file" accept="application/pdf,image/*" style="display:none" onchange="receipt(\''+j.id+'\',this)"></label></div>'+(j.sent?'<div class="sub" style="color:#1b5e20;font-weight:700">📧 Αναφορά στον πελάτη: '+esc(j.sent)+'</div>':(j.email?'':'<div class="sub" style="color:#a12622">Χωρίς email πελάτη</div>'));
   h+='<textarea rows="2" placeholder="Σημείωση (π.χ. χαλασμένη λάμπα στον 2ο)" onchange="act(\''+j.id+'\',\'note\',this.value)">'+esc(j.cnote)+'</textarea></div>';});}
 document.getElementById('m').innerHTML=h;tickTimers();}
function receipt(id,inp){var f=inp.files&&inp.files[0];if(!f)return;if(f.size>8e6){toast('⚠️ Πολύ μεγάλο αρχείο');return;}toast('🧾 Ανέβασμα…');var fr=new FileReader();fr.onload=function(){google.script.run.withSuccessHandler(function(r){render(r);toast('🧾 Το παραστατικό ανέβηκε');}).withFailureHandler(function(e){toast('⚠️ '+(e.message||e));}).kaAppReceipt(KEY,id,fr.result,f.name);};fr.readAsDataURL(f);}
function tick(id,el,t){var o=getCk(id);o[t]=el.checked?1:0;setCk(id,o);if(el.checked)toast('✔️ '+t);}
function finish(id,k){var L=CKJ[id]||CK[k],o=getCk(id),miss=L.filter(function(t){return !o[t];});if(miss.length&&!confirm('Δεν έχεις τσεκάρει:\n• '+miss.join('\n• ')+'\n\nΝα το κλείσω έτσι κι αλλιώς;'))return;act(id,'done',L.filter(function(t){return o[t];}).join(' | '));}
function tickTimers(){[].forEach.call(document.querySelectorAll('.timer'),function(e){var n=new Date(),now=n.getHours()*60+n.getMinutes(),el=now-mins(e.getAttribute('data-t0')),pl=+e.getAttribute('data-dur')*60;e.textContent='⏱ '+el+' / '+pl+' λεπτά'+(el>pl?' – πάνω από τον χρόνο':'');e.className='timer'+(el>pl?' late':'');});}
document.getElementById('prev').onclick=function(){var d=pd(D);d.setDate(d.getDate()-1);load(ymd(d));};
document.getElementById('next').onclick=function(){var d=pd(D);d.setDate(d.getDate()+1);load(ymd(d));};
document.getElementById('today').onclick=function(){load(ymd(new Date()));};
var hr=new Date().getHours();document.getElementById('hello').textContent=(hr<12?'Καλημέρα':hr<18?'Καλό απόγευμα':'Καλησπέρα')+' · Καθαρά Χέρια';
setInterval(function(){tickTimers();var c=document.getElementById('cmp');c.style.transform='rotate('+(Math.random()*40-20)+'deg)';},30000);
if(BOSS){document.querySelector('h1').textContent='👁 Επόπτης';document.getElementById('hello').textContent='Ζωντανή εικόνα · ανανέωση κάθε λεπτό';document.body.className='boss';setInterval(function(){if(D)load(D,1);},60000);}
if(!KEY){document.getElementById('m').innerHTML='<div class="lock">🔒 <b>Μπούσουλας</b><br>Άνοιξε την εφαρμογή σκανάροντας το QR που σου δόθηκε.</div>';}else load(ymd(new Date()));
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
